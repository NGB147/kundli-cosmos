[build]
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Asset filenames are not content-hashed, so they must revalidate on every
# load. Netlify's default (max-age=0, must-revalidate + ETag) does exactly
# that and stays cheap; an explicit max-age here would serve stale JS to
# returning visitors after a deploy.
